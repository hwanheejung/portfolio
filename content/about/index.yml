hero:
  eyebrow: "Hi, I'm Hwanhee."
  heading: Building human-centered products through software
summary:
  heading: A product engineer who enjoys making complex things feel simple.
  body:
    - I work across product thinking, interface design, and frontend engineering.
    - I care about tools that help teams move faster without hiding how the system works.
principles:
  - id: user-impact-always
    title: User impact, always
    description: Users rarely announce friction before they leave. I study behavior and logs to uncover what they do not say, then make experiences clear from the first use. What matters is not what shipped, but how it improved a user's life.
  - id: buildership
    title: Buildership
    description: I own outcomes beyond role or team boundaries and move toward the root problem first. The priority is the fastest path to clarity—not whose task it was—while protecting the team and the whole Karrot experience.
  - id: deep-dive
    title: Deep dive
    description: I begin with context and intent, then trace the system down to the lowest useful level. I compare multiple paths, test assumptions, and propose the solution with the clearest trade-offs.
  - id: speed-small-simple
    title: Speed, small, simple
    description: I move quickly by reducing the problem. Small useful slices, simple systems, and short feedback loops turn uncertainty into evidence without adding weight the team must carry later.
history:
  heading: I have grown by moving between product and engineering.
  body:
    - My work has ranged from internal automation to customer-facing product experiences.
    - Each role taught me to treat implementation as part of product discovery, not the final handoff.
leadership:
  heading: Leadership is creating room for better decisions.
  body:
    - I clarify ownership, expose trade-offs, and build shared language around difficult technical choices.
problemSolving:
  heading: I look for the system behind the symptom.
  body:
    - A good fix should solve today's problem while making the next problem easier to understand.
maker:
  heading: I am happiest when an idea becomes something people can touch.
  description: Small experiments, interactive explanations, and useful tools keep my practice grounded.
  gallery: []
